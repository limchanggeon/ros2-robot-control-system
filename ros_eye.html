<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>ROS 2 관제 시스템 UI</title>
<script src="https://static.robotwebtools.org/threejs/current/three.min.js"></script>
<script src="https://static.robotwebtools.org/EventEmitter2/current/eventemitter2.min.js"></script>
<script src="https://static.robotwebtools.org/roslibjs/current/roslib.min.js"></script>
<script src="https://static.robotwebtools.org/ros2djs/current/ros2d.min.js"></script>
<script src="https://static.robotwebtools.org/ros3djs/current/ros3d.min.js"></script>

<style>
  body { font-family: sans-serif; }
  #viewer-container { position: relative; width: 800px; height: 600px; border: 1px solid #ccc; }
  #map-viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #robot-viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
</style>
</head>

<body>
  <h1>TurtleBot3 실시간 위치 관제</h1>
  <div id="viewer-container">
    <div id="map-viewer"></div>
    <div id="robot-viewer"></div>
  </div>
  <p>ROS 연결 상태: <span id="connection-status">연결되지 않음</span></p>

<script>
  function init() {
    // 1. ROS Bridge 서버에 연결
    const ros = new ROSLIB.Ros({
      url: 'ws://localhost:9090' // ROS Bridge 서버 주소
    });

    ros.on('connection', function() {
      document.getElementById('connection-status').innerText = '연결 성공';
      console.log('Connected to websocket server.');
    });

    ros.on('error', function(error) {
      document.getElementById('connection-status').innerText = '연결 오류';
      console.log('Error connecting to websocket server: ', error);
    });

    ros.on('close', function() {
      document.getElementById('connection-status').innerText = '연결 끊김';
      console.log('Connection to websocket server closed.');
    });

    // 2. 2D 지도 시각화 (ros2djs)
    const mapViewer = new ROS2D.Viewer({
      divID: 'map-viewer',
      width: 800,
      height: 600
    });

    const gridClient = new ROS2D.OccupancyGridClient({
      ros: ros,
      rootObject: mapViewer.scene,
      continuous: true // 지도가 업데이트될 때 다시 구독
    });

    // 지도가 로드되면 뷰어 크기를 지도에 맞춤
    gridClient.on('change', function() {
      mapViewer.scaleToDimensions(gridClient.currentGrid.width, gridClient.currentGrid.height);
      mapViewer.shift(gridClient.currentGrid.pose.position.x, gridClient.currentGrid.pose.position.y);
    });

    // 3. 3D 로봇 모델 및 TF 시각화 (ros3djs)
    const robotViewer = new ROS3D.Viewer({
      divID: 'robot-viewer',
      width: 800,
      height: 600,
      antialias: true,
      backgroundAlpha: 0.0 // 배경을 투명하게 설정
    });
    
    // 2D 지도와 3D 뷰의 카메라를 동기화하기 위한 설정
    // ros3djs는 3D이므로, 2D 지도처럼 보이게 카메라를 위에서 아래로 향하게 설정
    robotViewer.camera.position.z = 15; // 카메라 높이 조절

    // tf2_web_republisher에 연결하기 위한 TF 클라이언트 생성
    const tfClient = new ROSLIB.TFClient({
      ros: ros,
      angularThres: 0.01,
      transThres: 0.01,
      rate: 10.0,
      fixedFrame: 'map' // 고정 좌표계
    });

    // URDF 모델 로드 클라이언트 생성
    // TurtleBot3의 URDF는 'robot_description' 토픽에 발행됨
    const urdfClient = new ROS3D.UrdfClient({
        ros: ros,
        tfClient: tfClient,
        path: 'http://resources.robotwebtools.org/', // 메시 파일 등을 찾을 기본 경로
        rootObject: robotViewer.scene,
        loader: ROS3D.COLLADA_LOADER_2 // TurtleBot3 모델 포맷에 맞는 로더
    });
  }

  window.onload = init;
</script>
</body>
</html>
